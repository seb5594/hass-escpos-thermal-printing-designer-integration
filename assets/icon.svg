<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ESC/POS Thermal Printer Designer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c3ff"/>
      <stop offset="1" stop-color="#0b6fd6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04325f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- receipt coming out of the printer -->
  <g filter="url(#soft)">
    <path d="M150 300V92l16-14 16 14 16-14 16 14 16-14 16 14 16-14 16 14 16-14 16 14 16-14 16 14 16-14 16 14v208z" fill="#fff"/>
  </g>
  <path d="M256 214c-30-20-52-38-52-62 0-16 12-28 28-28 11 0 20 6 24 14 4-8 13-14 24-14 16 0 28 12 28 28 0 24-22 42-52 62z" fill="#ff5a6e" transform="translate(0 -10) scale(1 1)"/>
  <rect x="184" y="238" width="144" height="12" rx="6" fill="#b4c3d1"/>
  <rect x="204" y="264" width="104" height="12" rx="6" fill="#d3dde6"/>
  <!-- printer -->
  <g filter="url(#soft)">
    <rect x="86" y="290" width="340" height="150" rx="42" fill="url(#body)"/>
  </g>
  <rect x="112" y="284" width="288" height="30" rx="15" fill="#3d5568"/>
  <circle cx="148" cy="378" r="12" fill="#5fd17a"/>
  <rect x="176" y="368" width="84" height="20" rx="10" fill="#c3d0db"/>
  <!-- pencil -->
  <g transform="translate(342 452) rotate(-45)" filter="url(#soft)">
    <rect x="-24" y="-190" width="48" height="26" rx="8" fill="#f27b9a"/>
    <rect x="-24" y="-168" width="48" height="12" fill="#c8d2db"/>
    <rect x="-24" y="-156" width="48" height="146" fill="#ffc933"/>
    <rect x="-24" y="-156" width="14" height="146" fill="#ffdc6e"/>
    <path d="M-24 -10h48L0 46z" fill="#f6d9b0"/>
    <path d="M-9 22h18L0 46z" fill="#33414e"/>
  </g>
