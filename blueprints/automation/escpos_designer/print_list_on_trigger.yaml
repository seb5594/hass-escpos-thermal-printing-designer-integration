blueprint:
  name: Print a to-do list when something happens
  description: >-
    Prints a to-do list, for example the shopping list, whenever your trigger
    fires: a button is pressed, you leave home, a door opens - anything Home
    Assistant can trigger on.
  domain: automation
  author: seb5594
  homeassistant:
    min_version: 2025.1.0
  source_url: https://github.com/seb5594/hass-escpos-thermal-printing-designer-integration/blob/main/blueprints/automation/escpos_designer/print_list_on_trigger.yaml
  input:
    trigger:
      name: Trigger
      description: What starts the print.
      selector:
        trigger:
    todo_list:
      name: To-do list
      selector:
        entity:
          domain: todo
    printer:
      name: Printer
      description: Optional if only one printer is set up.
      default: []
      selector:
        device:
          integration: escpos_printer
          multiple: true
    only_if_open_items:
      name: Only print if the list is not empty
      description: Skip the print when there is nothing left to do.
      default: true
      selector:
        boolean:

mode: single
max_exceeded: silent
triggers: !input trigger
variables:
  todo_list: !input todo_list
  only_if_open_items: !input only_if_open_items
conditions:
  - condition: template
    value_template: "{{ not only_if_open_items or (states(todo_list) | int(0)) > 0 }}"
actions:
  - action: escpos_designer.print_todo_list
    data:
      entity_id: !input todo_list
      device_id: !input printer
