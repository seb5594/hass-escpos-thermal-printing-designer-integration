<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESC/POS Designer – live demo</title>
    <link rel="icon" href="icon.png" />
    <style>
      /* The Home Assistant theme variables the panel reads. */
      html { height: 100%; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
      body { margin: 0; height: 100%; display: flex; flex-direction: column; }
      body.light { --primary-color: #03a9f4; --text-primary-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272;
        --card-background-color: #fff; --primary-background-color: #fafafa; --secondary-background-color: #e5e5e5; --divider-color: rgba(0,0,0,.12); --error-color: #db4437; }
      body.dark { --primary-color: #03a9f4; --text-primary-color: #fff; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c; --primary-background-color: #111; --secondary-background-color: #2b2b2b; --divider-color: rgba(225,225,225,.12); --error-color: #ef5350; color-scheme: dark; }
      body { background: var(--primary-background-color); color: var(--primary-text-color); }
      .notice { flex: none; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
        min-height: 40px; padding: 6px 12px; font-size: 0.8125rem; text-align: center;
        background: var(--primary-color); color: var(--text-primary-color); }
      .notice a { color: inherit; font-weight: 500; }
      escpos-designer-panel { display: block; flex: 1; min-height: 0; --ed-footer-peek: 40px; }
      .boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
        padding: 24px; text-align: center; background: var(--primary-background-color); }
      .boot[hidden] { display: none; }
      .spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--divider-color); border-top-color: var(--primary-color); animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="notice" id="notice" hidden></div>
    <div class="boot" id="boot"><div class="spinner"></div><div id="boot-text">…</div><small id="boot-hint"></small></div>
    <script type="module" src="demo.js"></script>
  </body>
</html>
