line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF001", "RUF003"]

[lint.per-file-ignores]
".github/**" = ["E402", "PLR0915", "E501"]
"**/calendar_names.py" = ["E501"]
"frontend/dev/server.py" = ["PLR0911", "PLR0912", "T201"]

[format]
quote-style = "double"
